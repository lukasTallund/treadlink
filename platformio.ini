[platformio]
src_dir = main

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
; Actual hardware is a Waveshare ESP32-S3-Nano (16MB flash), not the Seeed
; XIAO ESP32S3 the board id implies — override the flash size accordingly.
board_upload.flash_size = 16MB
