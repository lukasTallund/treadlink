[platformio]
src_dir = main

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
; Actual hardware is a Waveshare ESP32-S3-Nano (16MB flash), not the Seeed
; XIAO ESP32S3 the board id implies — override the flash size accordingly.
board_upload.flash_size = 16MB

; Day-to-day build: WiFi radio stays off (see main.c) so it can't degrade
; the Garmin BLE connection. Flash *this* env for normal use.

[env:seeed_xiao_esp32s3_config]
; Same as above, but with the WiFi radio enabled — flash this one
; temporarily when you need the web UI (treadmill address, cadence
; tuning), then reflash the normal env afterwards.
extends = env:seeed_xiao_esp32s3
build_flags = -DTREADLINK_ENABLE_WIFI
